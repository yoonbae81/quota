name = "xcvkr-gateway"
main = "gateway/worker.ts"
compatibility_date = "2024-01-01"
workers_dev = false

# DEPRECATED 2026-10-18 — this worker has been DELETED from Cloudflare.
#   xcv.kr/hwpx* -> rebound directly to the `md2hwpx` worker
#   xcv.kr/mask* -> rebound directly to the `mask` worker (CF static assets,
#                   mask 레포 wrangler.jsonc routes; 2026-10-18 웹 UI Vercel→Workers 전환)
# Do NOT deploy this config again: it would recreate the worker and steal both
# routes back. Kept only as reference; see README "xcv.kr Routing Map".

# Routes are attached via the dashboard/CI for:
#   xcv.kr/hwpx*
#   xcv.kr/mask*
# (routes are zone-scoped and managed with `wrangler deploy`; see README)
routes = [
  { pattern = "xcv.kr/hwpx*", zone_name = "xcv.kr" },
  { pattern = "xcv.kr/mask*", zone_name = "xcv.kr" },
]
